spring:
  application:
    name: java-enterprise-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_platform}
    username: ${DB_USERNAME:platform_user}
    password: ${DB_PASSWORD:platform_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  security:
    jwt:
      # Replace in every deployed environment with a base64-encoded 256-bit secret.
      secret: ${JWT_SECRET:c2FuZHktc2FudG9zaC1kZXYtc2VjcmV0LWNoYW5nZS1iZWZvcmUtcHJvZHVjdGlvbi0xMjM0NTY3ODkw}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    demo-users:
      admin-password: ${ADMIN_PASSWORD:changeit-admin}
      user-password: ${USER_PASSWORD:changeit-user}
