spring:
  application:
    name: java-enterprise-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_platform}
    username: ${DB_USERNAME:platform_user}
    password: ${DB_PASSWORD:platform_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
